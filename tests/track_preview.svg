<svg xmlns="http://www.w3.org/2000/svg" width="452" height="512" viewBox="0 0 452 512">
<style>svg{background:#05080d}
#sheetTrack { display: block; width: 100%; height: auto; background: #05080d; border-radius: 6px; }
#sheetTrack .ice { fill: #16222e; }
#sheetTrack .board { fill: #24374b; }
#sheetTrack .r12 { fill: #1c5688; }
#sheetTrack .r8 { fill: #c6d2dd; }
#sheetTrack .r4 { fill: #ad3230; }
#sheetTrack .rb { fill: #dde6ee; }
#sheetTrack .hog { stroke: #ff5b5b; stroke-width: 1.8; }
#sheetTrack .back { stroke: #93a8bd; stroke-width: 1.2; }
#sheetTrack .tee { stroke: rgba(255,255,255,.30); stroke-width: 1; }
#sheetTrack .deadzone { fill: rgba(255,91,91,.12); }
#sheetTrack .outzone { fill: rgba(147,168,189,.10); }
#sheetTrack .fgz { fill: rgba(255,180,84,.07); stroke: #ffb454; stroke-width: 1; stroke-dasharray: 3 3; }
#sheetTrack .tick { stroke: #38506a; stroke-width: 1; }
#sheetTrack .lab { font: 600 7px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7d92a6; letter-spacing: .08em; }
#sheetTrack .lab.warn { fill: #ff8b8b; }
#sheetTrack .lab.hot { fill: #d7e3ee; }
#sheetTrack .path { fill: none; stroke: #7ee787; stroke-width: 1.6; stroke-dasharray: 4 3; opacity: .85; }
#sheetTrack .stop { stroke: #fff; stroke-width: 1.4; }
#sheetTrack .live { stroke: rgba(6,10,16,.85); stroke-width: 1; }
#sheetTrack .ghost { fill: none; stroke: rgba(215,227,238,.55); stroke-width: 1; }
#sheetTrack line.ghost { stroke-dasharray: 3 2; }
#sheetTrack .gone { stroke: #ff8b8b; stroke-width: 1.6; fill: none; }
#sheetTrack .drawzone { fill: rgba(126,231,135,.10); stroke: #7ee787; stroke-width: .8; stroke-dasharray: 3 2; }
</style>
